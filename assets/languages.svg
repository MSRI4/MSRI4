<svg xmlns="http://www.w3.org/2000/svg" width="420" height="200" viewBox="0 0 420 200" role="img" aria-label="Most Used Languages">
  <title>Most Used Languages</title>
  <style>
    text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Inter, Arial, sans-serif; }
    .title { font-size: 17px; font-weight: 700; fill: #C9B8FF; }
    .label { font-size: 13.5px; fill: #9A90C0; }
    .value { font-size: 13.5px; font-weight: 700; fill: #E6E0FF; }
    .fade { animation: fade 0.6s ease-out backwards; }
    @keyframes fade { from { opacity: 0; transform: translateX(-6px); } }
  </style>
  <rect x="0.5" y="0.5" width="419" height="199" rx="12" fill="#120C26" stroke="#2E2260"/>
  <text x="25" y="36" class="title">Most Used Languages</text>
  <text x="25" y="110" class="label">No public code yet. Push a repo!</text>
</svg>
