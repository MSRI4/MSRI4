<svg xmlns="http://www.w3.org/2000/svg" width="420" height="200" viewBox="0 0 420 200" role="img" aria-label="Ahmad Almasri&#x27;s GitHub Stats">
  <title>Ahmad Almasri&#x27;s GitHub Stats</title>
  <style>
    text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Inter, Arial, sans-serif; }
