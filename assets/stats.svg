          transform="rotate(-90 338 106)"/>
  <text x="338" y="111" text-anchor="middle" style="font-size:24px;font-weight:800;fill:#E6E0FF">5</text>
  <text x="338" y="125" text-anchor="middle" style="font-size:10px;fill:#9A90C0">contributions</text>
  <text x="338" y="180" text-anchor="middle" class="label" style="font-size:12px">2 active days / yr</text>
