  <g class="fade" style="animation-delay:150ms"><g transform="translate(25,54)" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" style="color:#9B7BFF"><polygon points="8.00,1.00 9.94,5.83 15.13,6.18 11.14,9.52 12.41,14.57 8.00,11.80 3.59,14.57 4.86,9.52 0.87,6.18 6.06,5.83" fill="none" stroke-linejoin="round"/></g><text x="50" y="66" class="label">Total stars</text><text x="262" y="66" class="value" text-anchor="end">0</text></g>
  <g class="fade" style="animation-delay:270ms"><g transform="translate(25,77)" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" style="color:#9B7BFF"><circle cx="8" cy="8" r="3.2"/><path d="M0.5 8h4.3M11.2 8h4.3"/></g><text x="50" y="89" class="label">Commits (12 mo)</text><text x="262" y="89" class="value" text-anchor="end">4</text></g>
  <g class="fade" style="animation-delay:390ms"><g transform="translate(25,100)" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" style="color:#9B7BFF"><circle cx="4" cy="3.2" r="2"/><circle cx="4" cy="12.8" r="2"/><circle cx="12" cy="12.8" r="2"/><path d="M4 5.2v5.6M12 10.8V6.5a3 3 0 0 0-3-3H7.2M8.8 1.8 7.1 3.5l1.7 1.7"/></g><text x="50" y="112" class="label">Pull requests</text><text x="262" y="112" class="value" text-anchor="end">0</text></g>
  <g class="fade" style="animation-delay:510ms"><g transform="translate(25,123)" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" style="color:#9B7BFF"><circle cx="8" cy="8" r="6.6"/><circle cx="8" cy="8" r="1.4" fill="currentColor"/></g><text x="50" y="135" class="label">Issues</text><text x="262" y="135" class="value" text-anchor="end">0</text></g>
  <g class="fade" style="animation-delay:630ms"><g transform="translate(25,146)" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" style="color:#9B7BFF"><rect x="2.5" y="1.5" width="11" height="13" rx="1.6"/><path d="M5.6 1.5v13"/></g><text x="50" y="158" class="label">Public repos</text><text x="262" y="158" class="value" text-anchor="end">1</text></g>
  <g class="fade" style="animation-delay:750ms"><g transform="translate(25,169)" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" style="color:#9B7BFF"><polygon points="9.2,0.8 3,9 7.4,9 6.6,15.2 13,6.8 8.6,6.8" fill="currentColor" stroke="none"/></g><text x="50" y="181" class="label">Streak (now / best)</text><text x="262" y="181" class="value" text-anchor="end">2 / 2</text></g>
